<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#050811"/><stop offset="40%" stop-color="#0a1024"/><stop offset="80%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4"/></stop><stop offset="50%" stop-color="#3b82f6"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#3b82f6;#8b5cf6;#10b981;#3b82f6"/></stop><stop offset="100%" stop-color="#10b981"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#10b981;#06b6d4;#3b82f6;#10b981"/></stop></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="strongGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.2" fill="rgba(14, 165, 233, 0.25)"/></pattern><style>@keyframes beaconPulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.6);opacity:.1}}@keyframes botPath1{0%{transform:translate(0,0)}50%{transform:translate(60px,-30px)}}@keyframes botPath2{0%{transform:translate(0,0)}50%{transform:translate(-40px,40px)}}.pulse-beacon{animation:beaconPulse 2.5s cubic-bezier(.4,0,.6,1) infinite;transform-origin:center}.radar-sweep{animation:radarRotate 8s linear infinite;transform-origin:980px 180px}.telemetry-flow{stroke-dasharray:8 6;animat