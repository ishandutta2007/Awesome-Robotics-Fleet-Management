<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0a1024" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Animated Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#10b981;#3b82f6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#3b82f6;#10b981" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Floor Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.2" fill="rgba(14, 165, 233, 0.25)" />
    </pattern>

    <style>
      .pulse-beacon {
        animation: beaconPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      @keyframes beaconPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.6); opacity: 0.1; }
      }
      .radar-sweep {
        animation: radarRotate 8s linear infinite;
        transform-origin: 980px 180px;
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .telemetry-flow {
        stroke-dasharray: 8 6;
        animation: dashFlow 12s linear infinite;
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      .bot-move-1 {
        animation: botPath1 10s ease-in-out infinite alternate;
      }
      @keyframes botPath1 {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(60px, -30px); }
        100% { transform: translate(120px, 10px); }
      }
      .bot-move-2 {
        animation: botPath2 8s ease-in-out infinite alternate;
      }
      @keyframes botPath2 {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(-40px, 40px); }
        100% { transform: translate(-80px, -20px); }
      }
      .glow-badge {
        transition: all 0.3s ease;
      }
      .glow-badge:hover {
        filter: url(#glow);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Ambient Light Halos -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" opacity="0.12" filter="url(#strongGlow)" />
  <circle cx="980" cy="180" r="180" fill="#0d9488" opacity="0.14" filter="url(#strongGlow)" />
  <circle cx="600" cy="80" r="120" fill="#6366f1" opacity="0.08" filter="url(#strongGlow)" />

  <!-- Waypoint Route Mesh (Warehouse / RobOps Network) -->
  <g stroke="#0284c7" stroke-width="1.5" opacity="0.3" class="telemetry-flow">
    <line x1="820" y1="180" x2="980" y2="180" />
    <line x1="980" y1="180" x2="1120" y2="120" />
    <line x1="980" y1="180" x2="1100" y2="260" />
    <line x1="980" y1="180" x2="920" y2="90" />
    <line x1="980" y1="180" x2="940" y2="290" />
    <line x1="820" y1="180" x2="920" y2="90" />
    <line x1="1120" y1="120" x2="1100" y2="260" />
    <line x1="820" y1="180" x2="720" y2="220" stroke="#10b981" stroke-width="2" />
  </g>

  <!-- Radar Orbit Rings & Sweep -->
  <g transform="translate(980, 180)">
    <circle r="40" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1" />
    <circle r="80" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="120" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1" />
    <circle r="150" fill="none" stroke="rgba(6, 182, 212, 0.1)" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="-150" y1="0" x2="150" y2="0" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1" />
    <line x1="0" y1="-150" x2="0" y2="150" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1" />
  </g>

  <!-- Rotating Radar Beam -->
  <path class="radar-sweep" d="M 980 180 L 1130 180 A 150 150 0 0 0 1086 74 Z" fill="url(#titleGrad)" opacity="0.12" />

  <!-- Fleet AMR Robots on Waypoints -->
  <!-- Central Fleet Orchestrator Hub -->
  <g transform="translate(980, 180)">
    <circle r="20" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
    <circle r="8" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="32" fill="#38bdf8" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">HUB-01</text>
  </g>

  <!-- Robot AMR Alpha -->
  <g class="bot-move-1" transform="translate(860, 120)">
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#06b6d4" />
    <circle cx="-10" cy="-8" r="2" fill="#10b981" />
    <circle cx="10" cy="-8" r="2" fill="#10b981" />
    <rect x="-12" y="6" width="24" height="3" rx="1.5" fill="#38bdf8" opacity="0.7" />
    <text x="0" y="-18" fill="#7dd3fc" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AMR-01 [ACTIVE]</text>
  </g>

  <!-- Robot AMR Beta -->
  <g class="bot-move-2" transform="translate(1080, 240)">
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#10b981" />
    <circle cx="-10" cy="-8" r="2" fill="#38bdf8" />
    <circle cx="10" cy="-8" r="2" fill="#38bdf8" />
    <rect x="-12" y="6" width="24" height="3" rx="1.5" fill="#10b981" opacity="0.7" />
    <text x="0" y="26" fill="#6ee7b7" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AMR-02 [TRANSIT]</text>
  </g>

  <!-- Static Waypoints / Infrastructure Nodes -->
  <g transform="translate(1120, 120)">
    <circle r="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <circle r="2" fill="#f59e0b" />
    <text x="14" y="4" fill="#fcd34d" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="9" font-weight="600">CHARGER-A</text>
  </g>

  <g transform="translate(940, 290)">
    <circle r="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <circle r="2" fill="#8b5cf6" />
    <text x="14" y="4" fill="#c4b5fd" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="9" font-weight="600">LIFT-GATE</text>
  </g>

  <!-- Left Side Header & Branding Content -->
  <!-- Top Category Tag -->
  <g transform="translate(70, 52)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981" class="pulse-beacon" />
    <text x="28" y="18" fill="#38bdf8" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FLEET INTELLIGENCE &amp; ROBOPS</text>
  </g>

  <!-- Main Banner Title -->
  <text x="70" y="125" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Robotics Fleet
  </text>
  <text x="70" y="175" fill="#f8fafc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5">
    Management &amp; RobOps 🤖
  </text>

  <!-- Subtitle -->
  <text x="70" y="218" fill="#94a3b8" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="15" font-weight="400" letter-spacing="0.3">
    Multi-Robot Orchestration • Autonomous Mobile Fleets • VDA 5050 • Open-RMF • Teleoperation
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(70, 252)">
    <!-- Pill 1 -->
    <g class="glow-badge" transform="translate(0, 0)">
      <rect width="130" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="65" y="20" fill="#7dd3fc" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📡 Open-RMF</text>
    </g>
    <!-- Pill 2 -->
    <g class="glow-badge" transform="translate(142, 0)">
      <rect width="125" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="#10b981" stroke-width="1.2" />
      <text x="62" y="20" fill="#6ee7b7" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ VDA 5050</text>
    </g>
    <!-- Pill 3 -->
    <g class="glow-badge" transform="translate(279, 0)">
      <rect width="120" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="60" y="20" fill="#c4b5fd" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🦾 ROS 2 / DDS</text>
    </g>
    <!-- Pill 4 -->
    <g class="glow-badge" transform="translate(411, 0)">
      <rect width="135" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="#06b6d4" stroke-width="1.2" />
      <text x="67" y="20" fill="#67e8f9" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🎮 Teleoperation</text>
    </g>
    <!-- Pill 5 -->
    <g class="glow-badge" transform="translate(558, 0)">
      <rect width="130" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="#f59e0b" stroke-width="1.2" />
      <text x="65" y="20" fill="#fcd34d" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📊 Observability</text>
    </g>
  </g>

  <!-- Live Pulse Stats Bar -->
  <g transform="translate(70, 312)">
    <circle cx="6" cy="6" r="4" fill="#10b981">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" fill="#64748b" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" font-weight="500">
      SYSTEM STATUS: <tspan fill="#10b981" font-weight="700">ONLINE</tspan> &bull; FLEET TOPOLOGY: <tspan fill="#38bdf8" font-weight="700">MULTI-VENDOR ORCHESTRATED</tspan> &bull; PROTOCOLS: <tspan fill="#a78bfa" font-weight="700">ZENOH / MQTT / WEBRTC</tspan>
    </text>
  </g>
</svg>
